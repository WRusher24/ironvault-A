<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="IronVault">
  <title>IronVault</title>
  <defs>
    <linearGradient id="iv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <radialGradient id="iv-glow-green" cx="0.78" cy="0.14" r="0.62">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iv-glow-cyan" cx="0.16" cy="0.9" r="0.58">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iv-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#f1f5f9"/>
      <stop offset="0.38" stop-color="#aebdd0"/>
      <stop offset="0.62" stop-color="#cfdae8"/>
      <stop offset="0.86" stop-color="#8b9bb2"/>
      <stop offset="1" stop-color="#5f7189"/>
    </linearGradient>
    <linearGradient id="iv-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.42" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="iv-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="iv-badge">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iv-badge)">
    <rect width="512" height="512" fill="url(#iv-bg)"/>
    <rect width="512" height="512" fill="url(#iv-glow-green)"/>
    <rect width="512" height="512" fill="url(#iv-glow-cyan)"/>

    <!-- energy bloom behind the iron -->
    <ellipse cx="256" cy="256" rx="228" ry="146" fill="url(#iv-core)"/>

    <!-- dumbbell -->
    <g>
      <rect x="160.2" y="237.8" width="191.5" height="36.5" rx="18.2" fill="url(#iv-bar)"/>

      <rect x="112.4" y="186.5" width="52.4" height="139.1" rx="17.1" fill="url(#iv-metal)" stroke="#0f172a" stroke-opacity="0.28" stroke-width="2"/>
      <rect x="347.2" y="186.5" width="52.4" height="139.1" rx="17.1" fill="url(#iv-metal)" stroke="#0f172a" stroke-opacity="0.28" stroke-width="2"/>

      <rect x="59.9" y="154.5" width="61.6" height="203" rx="20.5" fill="url(#iv-metal)" stroke="#0f172a" stroke-opacity="0.28" stroke-width="2"/>
      <rect x="390.5" y="154.5" width="61.6" height="203" rx="20.5" fill="url(#iv-metal)" stroke="#0f172a" stroke-opacity="0.28" stroke-width="2"/>

      <!-- bevel highlights -->
      <g fill="#ffffff">
        <rect x="63.9" y="159.5" width="53.6" height="3.4" rx="1.7" opacity="0.6"/>
        <rect x="394.5" y="159.5" width="53.6" height="3.4" rx="1.7" opacity="0.6"/>
        <rect x="116.4" y="191.5" width="44.4" height="3.4" rx="1.7" opacity="0.5"/>
        <rect x="351.2" y="191.5" width="44.4" height="3.4" rx="1.7" opacity="0.5"/>
      </g>
    </g>

    <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
